[project]
name = "tasklite"
version = "0.1.0"
description = "Small task-list service used as the SDD business project"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tasklite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
