[project]
name = "sdd-context"
version = "0.1.0"
description = "SDD context module for the MiniMax x OceanBase 2026 ecosystem challenge"
requires-python = ">=3.11"
dependencies = [
    "pylibseekdb>=1.4.0.post1,<2; sys_platform == 'linux' or sys_platform == 'darwin'",
    "pymysql>=1.2,<1.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
server = [
    "powercontext[cli,server]==1.4.0",
]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
