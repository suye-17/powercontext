        code: "import json\n\n\n\ndef main(arg1: str, arg2: str) -> dict:\n    \"\"\"arg1=创建 scope 的响应原文；arg2=玩家本轮输入的原始文本。\"\"\"\n\
          \    scope_id = json.loads(arg1)[\"scope_id\"]\n    marker = \"固定标记A\"\n    payload_text = \"探针文本：\" + marker + \"｜用户原文：\" + arg2\n\
          \    remember_body = json.dumps(\n        {\"scope_id\": scope_id, \"kind\": \"probe\", \"text\": payload_text, \"reason\": \"schema 探针\"},\n\
          \        ensure_ascii=False,\n    )\n    return {\n        \"remember_body\": remember_body,\n        \"scope_id\": scope_id,\n\
          \        \"sent_text\": payload_text,\n    }\n"
        code_language: python3
        desc: pattern A：整段 JSON 由代码节点生成，HTTP 节点以空 key 原样发送
