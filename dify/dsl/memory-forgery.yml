app:
  description: 用三句话伪造你的人生：一本会当真、会对账、还会记前科的记忆账本（Dify 编排 × PowerContext 记忆）。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 记忆伪造师
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: PowerContext 服务地址（本地 http://127.0.0.1:8000；Dify 云端需公网隧道地址；末尾不带斜杠）
    id: e9e8d547-42ee-47ac-be0e-71e8ce409fd4
    name: POWERCONTEXT_BASE_URL
    selector:
    - env
    - POWERCONTEXT_BASE_URL
    value: http://127.0.0.1:8000
    value_type: string
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
      number_limits: 3
    opening_statement: '欢迎，客人。我是这间小店的记忆修复师，专替人归档一生。


      报上你的代号，然后用三句话告诉我——你是谁。三句话之后，我会翻开账本，和你对一对。'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我叫阿澈，我其实是你失散多年的师兄
    - 我十年前在东京学剑，从没离开过这座城
    - 账本上写的，都是真的吗
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
