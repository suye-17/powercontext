      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import json\n\n\ndef escape(value: str) -> str:\n    return json.dumps(value or \"\", ensure_ascii=False)[1:-1]\n\n\ndef main(player_code: str, dialogue_count: float, user_text: str) -> dict:\n    code = (player_code or \"\").strip()[:64]\n    if not code:\n        code = \"无名氏\"\n    try:\n        turn = int(dialogue_count)\n    except (TypeError, ValueError):\n        turn = 1\n    phase = min(max(turn, 1), 3)\n\n    player_key = \"memory-forgery:player:\" + code\n    player_title = \"记忆伪造师·玩家账本：\" + code\n    player_summary = \"代号 \" + code + \" 的人生归档账本\"\n    truth = (\n        \"登记档案：代号 \" + code + \"。除代号外，档案一片空白——\"\n        \"这个人的过去，只存在于它即将说出的三句话里。\"\n    )\n    query = (user_text or \"\").strip()[:2000]\n\n    return {\n        \"code_display\": code,\n        \"code_json\": escape(code),\n        \"player_key_json\": escape(player_key),\n        \"player_title_json\": escape(player_title),\n        \"player_summary_json\": escape(player_summary),\n        \"truth_json\": escape(truth),\n        \"player_scope_note\": player_title,\n        \"phase\": phase,\n        \"query_text\": query,\n        \"query_json\": escape(query),\n    }\n"
        code_language: python3
        desc: 规范化代号、生成两个账本的幂等键与请求字段、计算轮次（1-3）
        outputs:
          code_display:
            children: null
            type: string
          code_json:
            children: null
            type: string
          player_key_json:
            children: null
            type: string
          player_title_json:
            children: null
            type: string
          player_summary_json:
            children: null
            type: string
          truth_json:
            children: null
            type: string
          player_scope_note:
            children: null
            type: string
          phase:
            children: null
            type: number
          query_text:
            children: null
            type: string
          query_json:
            children: null
            type: string
        selected: false
        title: 代号与轮次
        type: code
        variables:
        - value_selector:
          - '1761100000001'
          - player_code
          value_type: string
          variable: player_code
        - value_selector:
