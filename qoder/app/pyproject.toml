[project]
name = "paperdesk"
version = "0.1.0"
description = "PaperDesk: a reading workbench with seekdb retrieval and PowerContext memory"
requires-python = ">=3.11"
dependencies = [
    "pylibseekdb>=1.4.0.post1,<2; sys_platform == 'linux' or sys_platform == 'darwin'",
    "pymysql>=1.2,<1.2.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]
server = [
    "powercontext[cli,server]==1.4.0",
]

[project.scripts]
paperdesk = "paperdesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
